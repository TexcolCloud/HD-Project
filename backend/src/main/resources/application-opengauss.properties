spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.opengauss.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.data-source-properties.stringtype=unspecified
spring.datasource.hikari.data-source-properties.use_boolean=true
spring.datasource.hikari.data-source-properties.currentSchema=public
spring.sql.init.schema-locations=classpath:db/opengauss/schema.sql
app.migration-location=db/opengauss/V2__dynamic_dispatch.sql
