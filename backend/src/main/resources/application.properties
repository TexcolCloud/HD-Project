server.port=${PORT:8080}
spring.profiles.default=local
spring.application.name=dormlink
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
app.seed=${APP_SEED:true}
app.files=${FILE_STORAGE:./data/uploads}
app.cookie-secure=${COOKIE_SECURE:false}
app.ai.base-url=${AI_BASE_URL:https://api.deepseek.com}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:deepseek-flash}
app.ai.daily-limit=${AI_DAILY_LIMIT:10}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
