name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts-web-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/check-local-secrets.py
      - run: npm ci --prefix web
      - run: python scripts/check-contracts.py
      - run: npm run format:check --prefix web
      - run: npm test --prefix web
      - run: node --test harmony/tests/*.test.mjs
      - run: npm run build --prefix web
      - run: ./backend/mvnw -B -f backend/pom.xml verify
      - run: python scripts/format-java.py
      - run: python scripts/test-quality.py
      - run: python scripts/check-java.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-reports
          path: |
            output/quality/
            backend/target/surefire-reports/
  # openGauss VM and DevEco emulator gates run locally; hosted runners have neither.
